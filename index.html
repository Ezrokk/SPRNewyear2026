<script>
function checkAnswer(buttonElem) {
    const box = buttonElem.parentElement;
    const input = box.querySelector(".answerInput").value.trim().toLowerCase();
    const answers = box.dataset.answer.split(',').map(a => a.trim().toLowerCase());
    const result = box.querySelector(".result");
    const answerBox = box.querySelector(".answerBox");

    if (box.dataset.done === "true") {
        answerBox.style.display = "block";
        return;
    }

    // Проверка, есть ли введённый вариант в списке правильных
    if (answers.includes(input)) {
        let points = Number(box.dataset.points);
        result.style.color = "#7effb6";
        result.innerText = "Верно! +" + points + " очков";

        score += points;
        localStorage.setItem("winterScore_" + nickname, score);
        document.getElementById("scoreValue").innerText = score;

        // Показать введённый вариант как правильный
        answerBox.innerText = "Правильный ответ: " + input;
    } else {
        result.style.color = "#ff8c8c";
        result.innerText = "Неправильно!";

        // Показать все варианты как подсказку
        answerBox.innerText = "Правильный ответ: " + answers.join(', ');
    }

    answerBox.style.display = "block";
    box.dataset.done = "true";

    updateLeaderboard();
}
</script>
