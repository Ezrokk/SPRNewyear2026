<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Арктическая Экспедиция — Загадки</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap');

    body {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(#0a1624, #0e2338 40%, #173b5a);
        color: white;
        overflow-x: hidden;
    }

    .aurora {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        background: radial-gradient(circle at 30% 20%, rgba(0,255,170,0.25), transparent 60%),
                    radial-gradient(circle at 70% 60%, rgba(0,155,255,0.25), transparent 60%);
        mix-blend-mode: screen;
        animation: auroraMove 12s infinite alternate;
        z-index: -1;
    }
    @keyframes auroraMove {
        from { transform: translateY(-20px) translateX(-20px); }
        to   { transform: translateY(20px) translateX(20px); }
    }

    header {
        text-align: center;
        padding: 60px 20px 30px;
    }

    h1 {
        font-size: 46px;
        font-weight: 600;
        background: linear-gradient(90deg, #9ae8ff, #d2faff, #ffffff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 20px rgba(180,255,255,0.3);
    }

    .score {
        margin-top: 10px;
        font-size: 20px;
        color: #b9eaff;
        font-weight: 600;
    }

    .nicknameBox {
        text-align: center;
        margin-top: 20px;
    }

    .nicknameInput {
        padding: 12px;
        width: 250px;
        border-radius: 6px;
        border: none;
    }

    .container {
        max-width: 850px;
        margin: 0 auto;
        padding: 20px;
    }

    .riddle {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        padding: 20px;
        margin: 25px 0;
        border-radius: 12px;
        backdrop-filter: blur(6px);
        transition: 0.3s;
        opacity: 0.4;
        pointer-events: none;
    }

    .riddle.active {
        opacity: 1;
        pointer-events: auto;
    }
